<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulação Financeira - Imóvel</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1, h2 { color: #2c3e50; }
    label { display: block; margin-top: 10px; }
    input { padding: 5px; width: 200px; }
    button { margin-top: 15px; padding: 10px 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: right; }
    th { background-color: #f4f4f4; }
    .positivo { color: green; font-weight: bold; }
    .negativo { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Simulação Financeira - Imóvel</h1>

  <h2>Dados de Entrada</h2>
  <label>Valor do Imóvel:</label>
  <input type="number" id="valorImovel" placeholder="475000">

  <label>Salário Bruto:</label>
  <input type="number" id="salarioBruto" placeholder="12477.61">

  <label>Despesas Atuais (aluguel + condomínio):</label>
  <input type="number" id="despesasAtuais" placeholder="2500">

  <label>Despesas Novas (parcela + condomínio):</label>
  <input type="number" id="despesasNovas" placeholder="3400">

  <label>Prestação do Financiamento:</label>
  <input type="number" id="prestacaoFinanciamento" placeholder="3000">

  <button onclick="simular()">Simular</button>

  <h2>Resultado</h2>
  <table id="resultado">
    <tr>
      <th>Mês</th>
      <th>Total Entradas</th>
      <th>Total Saídas</th>
      <th>Saldo Líquido</th>
    </tr>
  </table>

<script>
// Funções simplificadas em JS

function calcularINSS(salarioBruto) {
  const faixas = [
    [1621.00, 0.075],
    [2902.84, 0.09],
    [4354.27, 0.12],
    [8475.55, 0.14]
  ];
  let desconto = 0, restante = salarioBruto, limiteAnterior = 0;
  for (let [limite, aliquota] of faixas) {
    const faixaValor = Math.min(restante, limite - limiteAnterior);
    if (faixaValor > 0) {
      desconto += faixaValor * aliquota;
      restante -= faixaValor;
    }
    limiteAnterior = limite;
  }
  return desconto;
}

function calcularIRRF(salarioBruto, inss) {
  const base = salarioBruto - inss;
  const faixas = [
    [2428.80, 0.0, 0.0],
    [2826.66, 0.075, 182.16],
    [3751.05, 0.15, 394.16],
    [4664.68, 0.225, 675.49],
    [999999, 0.275, 908.73]
  ];
  for (let [limite, aliquota, deducao] of faixas) {
    if (base <= limite) return base * aliquota - deducao;
  }
  return 0;
}

function fluxoEntradas(meses, salarioBruto) {
  let fluxo = [];
  for (let mes = 1; mes <= meses; mes++) {
    const inss = calcularINSS(salarioBruto);
    const irrf = calcularIRRF(salarioBruto, inss);
    const salarioLiquido = salarioBruto - inss - Math.max(irrf, 0);
    fluxo.push({ mes, total_entradas: salarioLiquido });
  }
  return fluxo;
}

function fluxoDespesasTransicao(meses, despesasAtuais, despesasNovas, inicioNovas, fimAtuais) {
  let fluxo = [];
  for (let mes = 1; mes <= meses; mes++) {
    let totalMes = 0;
    if (!fimAtuais || mes <= fimAtuais) totalMes += despesasAtuais;
    if (mes >= inicioNovas) totalMes += despesasNovas;
    fluxo.push({ mes, total_despesas: totalMes });
  }
  return fluxo;
}

function simular() {
  const valorImovel = parseFloat(document.getElementById("valorImovel").value) || 0;
  const salarioBruto = parseFloat(document.getElementById("salarioBruto").value) || 0;
  const despesasAtuais = parseFloat(document.getElementById("despesasAtuais").value) || 0;
  const despesasNovas = parseFloat(document.getElementById("despesasNovas").value) || 0;
  const prestacaoFinanciamento = parseFloat(document.getElementById("prestacaoFinanciamento").value) || 0;

  const meses = 12; // exemplo: 12 meses
  const entradas = fluxoEntradas(meses, salarioBruto);
  const despesas = fluxoDespesasTransicao(meses, despesasAtuais, despesasNovas, 2, 4);

  const tabela = document.getElementById("resultado");
  tabela.innerHTML = `
    <tr>
      <th>Mês</th>
      <th>Total Entradas</th>
      <th>Total Saídas</th>
      <th>Saldo Líquido</th>
    </tr>
  `;

  for (let mes = 1; mes <= meses; mes++) {
    const entradasMes = entradas.find(f => f.mes === mes).total_entradas;
    const despesasMes = despesas.find(f => f.mes === mes).total_despesas + prestacaoFinanciamento;
    const saldo = entradasMes - despesasMes;
    tabela.innerHTML += `
      <tr>
        <td>${mes}</td>
        <td>R$ ${entradasMes.toFixed(2)}</td>
        <td>R$ ${despesasMes.toFixed(2)}</td>
        <td class="${saldo >= 0 ? 'positivo' : 'negativo'}">R$ ${saldo.toFixed(2)}</td>
      </tr>
    `;
  }
}
</script>
</body>
</html>
