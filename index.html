<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulação de Financiamento - Tabela Price</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1, h2 { color: #2c3e50; }
    label { display: block; margin-top: 10px; }
    input { padding: 5px; width: 250px; }
    button { margin-top: 15px; padding: 10px 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: right; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>
  <h1>Simulação de Financiamento - Tabela Price</h1>

  <h2>Dados de Entrada</h2>
  <label>Valor do Imóvel:</label>
  <input type="number" id="valorImovel" placeholder="475000">

  <label>Valor da Entrada:</label>
  <input type="number" id="valorEntrada" placeholder="50000">

  <label>Data de Referência:</label>
  <input type="date" id="dataReferencia">

  <label>Taxa de Juros Anual (%):</label>
  <input type="number" id="taxaJuros" placeholder="10">

  <label>Número de Meses do Financiamento:</label>
  <input type="number" id="numMeses" placeholder="420">

  <button onclick="simularFinanciamento()">Calcular Financiamento</button>

  <h2>Resultado</h2>
  <table id="resultadoFinanciamento">
    <tr>
      <th>Mês</th>
      <th>Data</th>
      <th>Prestação (R$)</th>
      <th>Juros (R$)</th>
      <th>Amortização (R$)</th>
      <th>Saldo Devedor (R$)</th>
    </tr>
  </table>

<script>
function financiamentoPrice(valorFinanciado, taxaJurosAnual, meses) {
  const i_m = (taxaJurosAnual / 100) / 12;
  const pmt = valorFinanciado * (i_m * Math.pow(1 + i_m, meses)) / (Math.pow(1 + i_m, meses) - 1);

  let saldoDevedor = valorFinanciado;
  let amortizacao = [];

  for (let mes = 1; mes <= meses; mes++) {
    const juros = saldoDevedor * i_m;
    const amortizacaoMes = pmt - juros;
    saldoDevedor -= amortizacaoMes;

    amortizacao.push({
      mes: mes,
      prestacao_base: pmt,
      juros: juros,
      amortizacao: amortizacaoMes,
      saldo_devedor: saldoDevedor
    });
  }
  return amortizacao;
}

function simularFinanciamento() {
  const valorImovel = parseFloat(document.getElementById("valorImovel").value) || 0;
  const valorEntrada = parseFloat(document.getElementById("valorEntrada").value) || 0;
  const dataReferencia = new Date(document.getElementById("dataReferencia").value);
  const taxaJuros = parseFloat(document.getElementById("taxaJuros").value) || 0;
  const numMeses = parseInt(document.getElementById("numMeses").value) || 0;

  const valorFinanciado = valorImovel - valorEntrada;
  const fluxo = financiamentoPrice(valorFinanciado, taxaJuros, numMeses);

  const tabela = document.getElementById("resultadoFinanciamento");
  tabela.innerHTML = `
    <tr>
      <th>Mês</th>
      <th>Data</th>
      <th>Prestação (R$)</th>
      <th>Juros (R$)</th>
      <th>Amortização (R$)</th>
      <th>Saldo Devedor (R$)</th>
    </tr>
  `;

  for (let item of fluxo) {
    const dataMes = new Date(dataReferencia);
    dataMes.setMonth(dataReferencia.getMonth() + item.mes - 1);
    const dataFormatada = dataMes.toLocaleDateString("pt-BR");

    tabela.innerHTML += `
      <tr>
        <td>${item.mes}</td>
        <td>${dataFormatada}</td>
        <td>R$ ${item.prestacao_base.toFixed(2)}</td>
        <td>R$ ${item.juros.toFixed(2)}</td>
        <td>R$ ${item.amortizacao.toFixed(2)}</td>
        <td>R$ ${item.saldo_devedor.toFixed(2)}</td>
      </tr>
    `;
  }
}
</script>
</body>
</html>
